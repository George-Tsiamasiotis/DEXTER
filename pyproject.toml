[project]
name = "dexter"
version = "0.2.0-pre.28"
description = "Calculations and simulations in analytical and reconstructed configurations of toroidal fusion devices."
readme = "README.md"
authors = [
    { name = "George-Tsiamasiotis", email = "gt.develop@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alpha-shapes>=1.1.1",
    "matplotlib>=3.11.1",
    "maturin>=1.14.1",
    "numpy==2.5.1", # maturin MSRV
    "pint>=0.25.3",
    "semver>=3.0.4",
]

[tool.maturin]
module-name = "dexter._core"
python-packages = ["dexter"]
python-source = "./py-dexter/"
manifest-path="./py-dexter/Cargo.toml"
# This also seems to solver maturin's and rust-analyzer's cache invalidation
# problem which forces pyo3 and rust-numpy to recompile every time
profile = "release"
editable-profile = "release"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ipython>=9.16.0",
    "maturin-import-hook>=0.3.0",
    "patchelf>=0.17.2.4",
    "xarray>=2026.7.0",
    "netcdf4>=1.7.4",
]
plot = [
    "pygobject>=3.56.3",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical==0.0.67",
]

[tool.pytest.ini_options]
testpaths = [ # Run from workspace root
    "./py-dexter/pytests",
    "./py-dexter/dexter/machine/*",
    "./py-dexter/dexter/simulate/*",
]
addopts = """
    --durations 2
    --doctest-glob='*.md'
    --doctest-glob='*.pyi'
    --doctest-glob='*.py'
    --doctest-modules
    --cov=dexter --cov-report term --cov-report html
    --log-disable=pint.util
"""
filterwarnings = [
    "ignore:.*Figure.*", # matplotlib non-interactive
]

[tool.pyright]
include = ["py-dexter", "tools"]
exclude = ["py-dexter/examples", "py-dexter/pytests"]
typeCheckingMode = "standard"
# Enable some options that are disabled in standard mode
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
reportMissingTypeStubs = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportDuplicateImport = "warning"
reportIncompleteStub = "error"
reportInconsistentConstructor = "error"
reportInvalidStubStatement = "error"
reportMatchNotExhaustive = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportTypeCommentUsage = "warning"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnusedImport = "information"
reportUnusedFunction = "information"
reportUnusedVariable = "information"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportCallInDefaultInitializer = "warning"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "warning"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "warning"

# remaining diagnostics
reportImportCycles = false
reportUnknownMemberType = false
reportUnusedCallResult = false
reportPrivateUsage = false
reportUnreachable = false
reportUnusedClass = false


[project.scripts]
dexter-plot-current = "scripts:plot_current"
dexter-plot-qfactor = "scripts:plot_qfactor"
dexter-plot-bfield  = "scripts:plot_bfield"
dexter-plot-mode  = "scripts:plot_mode"
